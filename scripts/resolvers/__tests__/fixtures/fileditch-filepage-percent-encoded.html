.gone h2{font-family:'Montserrat',sans-serif;font-size:1.4rem;font-weight:800;color:var(--bright);margin:0;letter-spacing:-.015em}
.gone p{font-size:.82rem;color:var(--muted);max-width:430px;margin:0;line-height:1.7}
.gone .gone-path{margin-top:6px;font-family:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.76rem;color:var(--text);word-break:break-all;background:var(--surface2);padding:8px 14px;border-radius:8px;border:1px solid var(--border)}
.verifying-overlay{position:fixed;inset:0;background:rgba(15,15,18,.88);display:flex;flex-direction:column;align-items:center;gap:16px;z-index:9998;backdrop-filter:blur(4px);padding:30px;text-align:center;overflow-y:auto;overscroll-behavior:contain}
.verifying-overlay>:first-child{margin-top:auto}
.verifying-overlay>:last-child{margin-bottom:auto}
.verifying-overlay>p{margin:0;font-size:.85rem;color:var(--muted);max-width:380px}
.spinner{width:34px;height:34px;border:3px solid rgba(124,106,247,.18);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:768px){
  img{max-height:70vh}
  .vshell > video{max-height:70vh}
}
@media (min-width:1680px){
  body{font-size:15px}

}
@media (min-width:2300px){
  body{font-size:16px}
  .wrap{max-width:1280px;padding:40px}
  .brand{font-size:1.2rem}
  img{max-height:66vh}
  .vshell > video{max-height:66vh}

  .preview .plyr:not(.plyr--fullscreen-active) .plyr__video-wrapper{max-height:66vh}
  .preview .plyr:not(.plyr--fullscreen-active) video{max-height:66vh}
}
